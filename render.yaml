services:
  # -------------------------------------------------------------
  # Backend Express API Web Service
  # -------------------------------------------------------------
  - type: web
    name: rtbs-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # -------------------------------------------------------------
  # Frontend React (Vite) Static Site
  # -------------------------------------------------------------
  - type: web
    name: rtbs-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: rtbs-backend
          property: host

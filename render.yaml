services:
  # -------------------------------------------------------------
  # Backend Express API Web Service
  # -------------------------------------------------------------
  - type: web
    name: rtbs-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # -------------------------------------------------------------
  # Frontend React (Vite) Static Site
  # -------------------------------------------------------------
  - type: static
    name: rtbs-frontend
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: rtbs-backend
          property: url
